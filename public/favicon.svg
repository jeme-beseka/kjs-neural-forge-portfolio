<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="hex-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="text-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <polygon points="32,3 58,18 58,46 32,61 6,46 6,18" fill="#050c14"/>
  <polygon points="32,3 58,18 58,46 32,61 6,46 6,18" fill="none" stroke="url(#hex-grad)" stroke-width="2.5" filter="url(#glow)"/>
  <text x="32" y="41" text-anchor="middle" font-family="Space Grotesk,Arial,sans-serif" font-weight="800" font-size="22" fill="#00d4ff" letter-spacing="1" filter="url(#text-glow)">JB</text>
</svg>
